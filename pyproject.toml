[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-mcp"
version = "0.1.0"
description = "BYO-credentials MCP server + CLI to generate images with your own Google Gemini (Nano Banana) session."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nsozturk" }]
keywords = ["mcp", "gemini", "nano-banana", "image-generation", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "gemini_webapi==2.0.0",
    "mcp==1.28.1",
    "curl_cffi==0.15.0",
]

[project.scripts]
banana-mcp = "banana.server:main"
banana-generate = "banana.cli:main"

[project.urls]
Homepage = "https://github.com/nsozturk/banana-mcp"
Repository = "https://github.com/nsozturk/banana-mcp"

[tool.setuptools]
packages = ["banana"]
